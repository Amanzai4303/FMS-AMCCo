<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – AMCC FMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --deep: #152026;
            --dark-blue: #1B3D59;
            --mid-blue: #6A97C0;
            --light-blue: #B3D5F1;
            --pale-blue: #D4EEF8;
            --cream: #F3EED8;
        }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffffff 50%, var(--deep) 50%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .split-container {
            display: flex;
            min-height: 100vh;
        }
        .left-panel {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }
        .right-panel {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--deep) 0%, var(--dark-blue) 100%);
            flex-direction: column;
            padding: 2rem;
            text-align: center;
            color: #fff;
        }
        .login-card {
            background: rgba(255,255,255,0.98);
            padding: 2.8rem;
            border-radius: 1.2rem;
            box-shadow: 0 1.2rem 3.5rem rgba(0,0,0,0.18);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--cream);
        }
        .login-card h3 {
            font-weight: 700;
            margin-bottom: 0.3rem;
            color: var(--dark-blue);
            letter-spacing: -0.5px;
        }
        .login-card .subtitle {
            color: #5a6070;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-label {
            font-weight: 500;
            color: var(--deep);
        }
        .btn-login {
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 0.5rem;
            background: var(--mid-blue);
            border: none;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: var(--dark-blue);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(106,151,192,0.4);
        }
        .input-group-text {
            background: var(--pale-blue);
            border: 1px solid #ced4da;
            color: var(--dark-blue);
        }
        .welcome-text h1 {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }
        .welcome-text p {
            font-size: 1.05rem;
            opacity: 0.9;
            max-width: 320px;
            margin: 0 auto;
            color: var(--light-blue);
        }
        .company-badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-top: 1.5rem;
            color: var(--light-blue);
        }
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
            }
            .left-panel, .right-panel {
                width: 100%;
                min-height: 50vh;
            }
            .right-panel {
                background: linear-gradient(180deg, var(--deep) 0%, var(--dark-blue) 100%);
            }
        }
    </style>
</head>
<body>
    <div class="split-container">
        <!-- Left: Login form -->
        <div class="left-panel">
            <div class="login-card">
                <h3><i class="bi bi-buildings me-2" style="color:var(--mid-blue);"></i>AMCC FMS</h3>
                <p class="subtitle">Arman Maihan Construction Company<br>Financial Management System</p>

                {% if form.errors %}
                    <div class="alert alert-danger py-2">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> Invalid username or password.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-login">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                    </button>
                </form>
            </div>
        </div>

        <!-- Right: Welcome -->
        <div class="right-panel">
            <div class="welcome-text">
                <h1>Welcome to AMCC Financial Management</h1>
                <p>Project‑driven financial control for modern construction management.</p>
                <div class="company-badge">
                    <i class="bi bi-shield-check me-1"></i> ARMAN MAIHAN CONSTRUCTION CO.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
